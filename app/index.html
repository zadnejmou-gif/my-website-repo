<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03130D">
<meta name="robots" content="noindex">
<title>DropBy · Bientôt sur l'App Store et Google Play</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{min-height:100%;display:grid;place-items:center;padding:28px 16px;background:radial-gradient(90% 60% at 50% 30%,#0F7A54 0%,#053D2A 45%,#03130D 85%);color:#EEF6F0;font:500 16px/1.5 Sora,system-ui,sans-serif;text-align:center}
main{width:min(440px,100%);display:flex;flex-direction:column;align-items:center;gap:18px}
.logo{width:88px;height:88px;border-radius:24px;box-shadow:0 20px 50px -18px rgba(0,0,0,.8),0 0 0 6px rgba(61,220,151,.14)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(61,220,151,.12);color:#3DDC97;font-weight:700;font-size:13px;box-shadow:inset 0 0 0 1px rgba(61,220,151,.3)}
.pill i{width:8px;height:8px;border-radius:50%;background:#3DDC97;animation:b 1.6s infinite}@keyframes b{50%{opacity:.3}}
h1{font-size:clamp(28px,7vw,38px);line-height:1.12;letter-spacing:-.03em;font-weight:800}
h1 em{font-style:normal;color:#3DDC97}
.ar{font-family:"IBM Plex Sans Arabic",sans-serif;direction:rtl;font-weight:700;font-size:20px;color:rgba(238,246,240,.9)}
p{color:rgba(238,246,240,.72)}
.stores{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.store{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:14px;background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);text-align:left;opacity:.9}
.store svg{width:24px;height:24px;fill:#fff}.store small{display:block;font-size:10.5px;color:rgba(255,255,255,.7)}.store b{font-size:15px}
.btn{margin-top:6px;display:inline-flex;padding:13px 22px;border-radius:14px;background:#fff;color:#03130D;font-weight:700;text-decoration:none}
.ig{color:#3DDC97;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <img class="logo" src="/icon-192.png" alt="DropBy">
  <span class="pill"><i></i>Bientôt disponible</span>
  <h1>DropBy arrive sur <em>l'App Store</em> et <em>Google Play</em>.</h1>
  <p class="ar">التطبيق جاي قريب، تبّعونا باش ما يفوتكمش الإطلاق</p>
  <p>Commande ton repas près de la fac, un étudiant te l'apporte sur le campus. Abonne-toi pour ne pas rater le lancement.</p>
  <div class="stores" aria-label="Bientôt sur">
    <span class="store"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.8 1.2 1.8 2.6 3.1 2.5 1.3-.1 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.6-1-2.6-4.2zM13.9 4.9c.7-.9 1.2-2 1-3.2-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3.1 1.1.1 2.2-.6 2.9-1.4z"/></svg><span><small>Bientôt sur</small><b>App Store</b></span></span>
    <span class="store"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 2.3c-.3.3-.4.7-.4 1.3v16.8c0 .6.1 1 .4 1.3l9.3-9.7zM14.3 13.4l2.9 3-10.8 6.2c-.6.3-1.1.3-1.5.1zM18.6 15.6l-3.3-3.6 3.3-3.6 3.3 1.9c1 .6 1 2.6 0 3.2zM4.9 1.3c.4-.2.9-.2 1.5.1l10.8 6.2-2.9 3z"/></svg><span><small>Bientôt sur</small><b>Google Play</b></span></span>
  </div>
  <a class="btn" href="/">Découvrir DropBy</a>
</main>
</body>
</html>
